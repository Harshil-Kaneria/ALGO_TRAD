<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <nav
        class="navbar navbar-expand-lg navbar-dark bg-dark mb-2"
        role="navigation"
      >
        <!-- Brand and toggle get grouped for better mobile display -->
        <button
          class="navbar-toggler"
          type="button"
          data-toggle="collapse"
          data-target="#admin-navbar-collapse"
          aria-controls="admin-navbar-collapse"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <!-- navbar content -->
        <div class="collapse navbar-collapse" id="admin-navbar-collapse">
          <a class="navbar-brand" href="/admin">Smart AI Trading Admin</a>

          <ul class="nav navbar-nav mr-auto">
            <li class="active">
              <a class="nav-link" href="/admin/usertable/"> User Table</a>
            </li>
          </ul>

          <ul class="nav navbar-nav navbar-right">
            <li>
              <a class="nav-link" href="/logout"> Logout</a>
            </li>
          </ul>
        </div>
      </nav>

      <div class="row">
        <div class="col-md-4">
          <div class="card mb-3">
            <div class="card-header bg-primary">Total Users</div>
            <div class="card-body">
              <h5 class="card-title">{{ total_users }}</h5>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card mb-3">
            <div class="card-header bg-success">Total Paid Users</div>
            <div class="card-body">
              <h5 class="card-title">{{ total_paid_users }}</h5>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card mb-3">
            <div class="card-header bg-light">Total VIP Users</div>
            <div class="card-body">
              <h5 class="card-title">{{ total_vip_users }}</h5>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
